# Example overlay for tenant b. Do not set service.nodePort — onboard_tenant.py
# uses tofu output tenant_node_ports (30080 + index in var.tenant_ids).
fullnameOverride: test-app
serviceAccount:
  name: test-app
tenant:
  id: b
pathPrefix: /tenant-b
service:
  type: NodePort
  port: 8080
quota:
  enabled: true
networkPolicy:
  enabled: true
  ingressCidrs: []
database:
  migrate: false
