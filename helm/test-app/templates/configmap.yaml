    import json
    import os
    import sys
    import boto3
    import psycopg2
    from psycopg2 import sql

    region = os.getenv("AWS_REGION", "us-east-1")
    sm = boto3.client("secretsmanager", region_name=region)

    def load(name):
        return json.loads(sm.get_secret_value(SecretId=name)["SecretString"])

    master = load(os.environ["MASTER_SECRET"])
    tenants = json.loads(os.environ["TENANT_SECRETS"])

    conn = psycopg2.connect(
        host=master["host"],
        dbname=master.get("dbname", "postgres"),
        user=master["username"],
        password=master["password"],
        port=int(master.get("port", 5432)),
        sslmode="require",
    )
    conn.autocommit = True
    cur = conn.cursor()

    cur.execute(
        """
        CREATE TABLE IF NOT EXISTS sample_requests (
            id SERIAL PRIMARY KEY,
            timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            remote_ip INET,
            hostname VARCHAR(100),
            user_agent TEXT,
            message TEXT,
            tenant_id VARCHAR(64) NOT NULL
        )
        """
    )
    cur.execute("ALTER TABLE sample_requests ADD COLUMN IF NOT EXISTS message TEXT")
    cur.execute("ALTER TABLE sample_requests ADD COLUMN IF NOT EXISTS tenant_id VARCHAR(64)")
    cur.execute("CREATE INDEX IF NOT EXISTS idx_sample_requests_tenant_id ON sample_requests (tenant_id)")

    for tid, secret_name in tenants.items():
        creds = load(secret_name)
        role = creds["username"]
        password = creds["password"]
        cur.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
        if cur.fetchone():
            cur.execute(sql.SQL("ALTER ROLE {} PASSWORD {}").format(sql.Identifier(role), sql.Literal(password)))
        else:
            cur.execute(sql.SQL("CREATE ROLE {} LOGIN PASSWORD {}").format(sql.Identifier(role), sql.Literal(password)))
        cur.execute(sql.SQL("GRANT CONNECT ON DATABASE postgres TO {}").format(sql.Identifier(role)))
        cur.execute(sql.SQL("GRANT USAGE ON SCHEMA public TO {}").format(sql.Identifier(role)))
        cur.execute(sql.SQL("GRANT SELECT, INSERT, UPDATE, DELETE ON sample_requests TO {}").format(sql.Identifier(role)))
        cur.execute(sql.SQL("GRANT USAGE, SELECT ON SEQUENCE sample_requests_id_seq TO {}").format(sql.Identifier(role)))
        cur.execute(sql.SQL("DROP POLICY IF EXISTS {} ON sample_requests").format(sql.Identifier("tenant_%s_isolation" % tid)))
        cur.execute(
            sql.SQL(
                """
                CREATE POLICY {} ON sample_requests
                  FOR ALL TO {}
                  USING (tenant_id = {tid} AND current_setting('app.tenant_id', true) = {tid})
                  WITH CHECK (tenant_id = {tid} AND current_setting('app.tenant_id', true) = {tid})
                """
            ).format(
                sql.Identifier("tenant_%s_isolation" % tid),
                sql.Identifier(role),
                tid=sql.Literal(tid),
            )
        )

    cur.execute("ALTER TABLE sample_requests ENABLE ROW LEVEL SECURITY")
    cur.execute("ALTER TABLE sample_requests FORCE ROW LEVEL SECURITY")
    cur.close()
    conn.close()
    print(json.dumps({"msg": "migrate_ok", "tenants": list(tenants.keys()), "force_rls": True}), flush=True)
