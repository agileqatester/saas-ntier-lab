    import os
    import json
    import socket
    import sys
    from contextlib import contextmanager
    from flask import Flask, request, jsonify

    class PrefixMiddleware:
        def __init__(self, wsgi_app, prefix):
            self.wsgi_app = wsgi_app
            self.prefix = (prefix or "").rstrip("/")

        def __call__(self, environ, start_response):
            path = environ.get("PATH_INFO", "")
            if self.prefix and path.startswith(self.prefix):
                environ["PATH_INFO"] = path[len(self.prefix):] or "/"
                environ["SCRIPT_NAME"] = environ.get("SCRIPT_NAME", "") + self.prefix
            return self.wsgi_app(environ, start_response)

    app = Flask(__name__)
    PATH_PREFIX = os.getenv("PATH_PREFIX", "").strip()
    if PATH_PREFIX:
        app.wsgi_app = PrefixMiddleware(app.wsgi_app, PATH_PREFIX)

    DB_ENABLED = os.getenv("DB_ENABLED", "false").lower() == "true"
    TENANT_ID = os.getenv("TENANT_ID", "").strip()

    def log_event(**fields):
        payload = {"tenant_id": TENANT_ID or None}
        payload.update(fields)
        print(json.dumps(payload), flush=True)

    def tenant_missing():
        if DB_ENABLED and not TENANT_ID:
            return jsonify({"error": "TENANT_ID is not set on this pod"}), 500
        return None

    if DB_ENABLED:
        import boto3
        import psycopg2
        from psycopg2 import pool

        db_pool = None

        def get_db_credentials():
            try:
                client = boto3.client("secretsmanager", region_name=os.getenv("AWS_REGION", "us-east-1"))
                response = client.get_secret_value(SecretId=os.getenv("DB_SECRET_NAME"))
                return json.loads(response["SecretString"])
            except Exception as e:
                log_event(msg="secret_error", error=str(e))
                return None

        def init_db_pool():
            global db_pool
            try:
                creds = get_db_credentials()
                if creds:
                    db_pool = psycopg2.pool.SimpleConnectionPool(
                        1, 10,
                        host=os.getenv("DB_HOST") or creds.get("host"),
                        database=os.getenv("DB_NAME", creds.get("dbname", "postgres")),
                        user=creds["username"],
                        password=creds["password"],
                        port=int(os.getenv("DB_PORT", creds.get("port", 5432))),
                        sslmode="require",
                    )
                    log_event(msg="db_pool_ready", user=creds["username"])
            except Exception as e:
                log_event(msg="db_pool_error", error=str(e))

        def get_db_connection():
            conn = None
            try:
                if db_pool is None:
                    init_db_pool()
                conn = db_pool.getconn()
                if not conn:
                    return None
                conn.rollback()
                if TENANT_ID:
                    with conn.cursor() as cur:
                        cur.execute("SELECT set_config('app.tenant_id', %s, true)", (TENANT_ID,))
                return conn
            except Exception as e:
                log_event(msg="db_getconn_error", error=str(e))
                if conn is not None:
                    try:
                        db_pool.putconn(conn, close=True)
                    except Exception:
                        pass
                return None

        def return_db_connection(conn):
            if not conn or db_pool is None:
                return
            try:
                conn.rollback()
            except Exception:
                pass
            db_pool.putconn(conn)

        @contextmanager
        def db_conn():
            conn = get_db_connection()
            try:
                yield conn
            finally:
                return_db_connection(conn)

    @app.after_request
    def after_request(resp):
        log_event(msg="request", method=request.method, path=request.path, status=resp.status_code)
        return resp

    @app.route("/")
    def home():
        return jsonify({
            "message": "Test App Running",
            "hostname": socket.gethostname(),
            "ip": request.remote_addr,
            "db_enabled": DB_ENABLED,
            "tenant_id": TENANT_ID or None,
        })

    @app.route("/health")
    def health():
        health_status = {
            "status": "healthy",
            "hostname": socket.gethostname(),
            "db_enabled": DB_ENABLED,
            "tenant_id": TENANT_ID or None,
        }
        if DB_ENABLED:
            try:
                with db_conn() as conn:
                    if conn:
                        cursor = conn.cursor()
                        cursor.execute("SELECT 1")
                        cursor.close()
                        health_status["database"] = "connected"
                    else:
                        health_status["database"] = "disconnected"
            except Exception as e:
                health_status["database"] = "disconnected"
                health_status["db_error"] = str(e)
        return jsonify(health_status)

    @app.route("/db/version")
    def db_version():
        if not DB_ENABLED:
            return jsonify({"error": "Database not enabled"}), 400
        err = tenant_missing()
        if err:
            return err
        try:
            with db_conn() as conn:
                if not conn:
                    return jsonify({"status": "error", "message": "no db connection"}), 503
                cursor = conn.cursor()
                cursor.execute("SELECT version()")
                version = cursor.fetchone()
                cursor.execute("SELECT current_setting('app.tenant_id', true)")
                setting = cursor.fetchone()
                cursor.close()
                return jsonify({"status": "success", "db_version": version[0], "app.tenant_id": setting[0]})
        except Exception as e:
            return jsonify({"status": "error", "message": str(e)}), 500

    @app.route("/db/init")
    def init_db():
        if not DB_ENABLED:
            return jsonify({"error": "Database not enabled"}), 400
        err = tenant_missing()
        if err:
            return err
        try:
            with db_conn() as conn:
                if not conn:
                    return jsonify({"status": "error", "message": "no db connection"}), 503
                cursor = conn.cursor()
                cursor.execute(
                    "SELECT relrowsecurity, relforcerowsecurity FROM pg_class WHERE relname = 'sample_requests'"
                )
                row = cursor.fetchone()
                cursor.close()
                if not row:
                    return jsonify({"status": "error", "message": "table missing; run migrate Job"}), 503
                return jsonify({
                    "status": "success",
                    "rls": row[0],
                    "force_rls": row[1],
                    "tenant_id": TENANT_ID,
                })
        except Exception as e:
            return jsonify({"status": "error", "message": str(e)}), 500

    @app.route("/db/items", methods=["POST"])
    def create_item():
        if not DB_ENABLED:
            return jsonify({"error": "Database not enabled"}), 400
        err = tenant_missing()
        if err:
            return err
        body = request.get_json(silent=True) or {}
        message = body.get("message")
        if not message or not isinstance(message, str):
            return jsonify({"error": "JSON body must include a string \"message\""}), 400
        try:
            with db_conn() as conn:
                if not conn:
                    return jsonify({"status": "error", "message": "no db connection"}), 503
                cursor = conn.cursor()
                cursor.execute(
                    """
                    INSERT INTO sample_requests (remote_ip, hostname, user_agent, message, tenant_id)
                    VALUES (%s, %s, %s, %s, %s) RETURNING id, timestamp, message, tenant_id
                    """,
                    (
                        request.remote_addr,
                        socket.gethostname(),
                        request.headers.get("User-Agent", "Unknown"),
                        message,
                        TENANT_ID,
                    ),
                )
                result = cursor.fetchone()
                conn.commit()
                cursor.close()
                return jsonify({
                    "status": "success",
                    "id": result[0],
                    "timestamp": str(result[1]),
                    "message": result[2],
                    "tenant_id": result[3],
                }), 201
        except Exception as e:
            return jsonify({"status": "error", "message": str(e)}), 500

    @app.route("/db/records")
    def get_records():
        if not DB_ENABLED:
            return jsonify({"error": "Database not enabled"}), 400
        err = tenant_missing()
        if err:
            return err
        try:
            limit = request.args.get("limit", 10, type=int)
            with db_conn() as conn:
                if not conn:
                    return jsonify({"status": "error", "message": "no db connection"}), 503
                cursor = conn.cursor()
                cursor.execute(
                    """
                    SELECT id, timestamp, remote_ip, hostname, user_agent, message, tenant_id
                    FROM sample_requests
                    ORDER BY timestamp DESC
                    LIMIT %s
                    """,
                    (limit,),
                )
                rows = cursor.fetchall()
                cursor.close()
                records = [
                    {
                        "id": row[0],
                        "timestamp": str(row[1]),
                        "remote_ip": str(row[2]),
                        "hostname": row[3],
                        "user_agent": row[4],
                        "message": row[5],
                        "tenant_id": row[6],
                    }
                    for row in rows
                ]
                return jsonify({
                    "status": "success",
                    "count": len(records),
                    "tenant_id": TENANT_ID,
                    "records": records,
                })
        except Exception as e:
            return jsonify({"status": "error", "message": str(e)}), 500

    if __name__ == "__main__":
        if DB_ENABLED:
            log_event(msg="starting", db=True)
            init_db_pool()
        else:
            log_event(msg="starting", db=False)
        app.run(host="0.0.0.0", port=8080)

