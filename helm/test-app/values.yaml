replicaCount: 1

image:
  repository: python
  tag: "3.11-slim"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: test-app

service:
  # Phase A default: ClusterIP behind shared ALB Ingress (group.name).
  # Lab NodePort mode still supported via onboard --edge nodeport.
  type: ClusterIP
  port: 8080
  nodePort: null

ingress:
  enabled: false
  className: alb
  scheme: internet-facing
  targetType: ip
  groupName: ntier-dev
  # Lower order = higher precedence within the shared ALB group.
  groupOrder: "100"
  healthcheckPath: /health
  inboundCidrs: []
  accessLogsBucket: ""
  accessLogsPrefix: alb
  annotations: {}

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Lab-only tenant authorization simulation. Not authentication.
# X-Lab-User is checked here; Postgres tenant_id still comes from tenant.id.
# Production should integrate an external OIDC/OAuth2 identity provider.
labAuth:
  users:
    alice: ["a"]
    bob: ["b"]
    admin: ["a", "b"]
    user-a: ["a"]
    user-b: ["b"]

# Pooled tenancy: set per Helm release. Not taken from the client.
tenant:
  id: ""

pathPrefix: ""

quota:
  enabled: false
  # 2 = migrate Job + 1 app replica. Scale to 3 → Pending.
  pods: "2"
  requestsCpu: "100m"
  requestsMemory: "256Mi"
  limitsCpu: "500m"
  limitsMemory: "512Mi"

networkPolicy:
  enabled: false
  # NodePort lab: node InternalIP/32 (kubelet + NodePort SNAT).
  # ALB controller (target-type ip): public subnet CIDRs only (ALB ENIs),
  # not the VPC CIDR — otherwise tenant pods could reach each other.
  ingressCidrs: []
  egress:
    # Default deny egress when networkPolicy.enabled. Explicit allows only.
    enabled: true
    postgresPort: 5432
    postgresCidrs: []
    # Lab: pip at startup + STS/Secrets Manager through NAT.
    # Production: bake the image and allow HTTPS only to interface VPCEs.
    allowInternetHttps: true

rbac:
  # Tenant SA cannot create/update Ingress (shared ALB group.name trust boundary).
  tenantLimited: true

# Database configuration
database:
  enabled: false
  secretName: ""
  host: ""
  name: "postgres"
  port: 5432
  migrate: false
  masterSecret: ""
  tenantSecrets: {}
  migratorServiceAccount:
    annotations: {}

# Environment
environment: dev
region: us-east-1