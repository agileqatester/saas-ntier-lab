replicaCount: 1

image:
  repository: python
  tag: "3.11-slim"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: test-app

service:
  type: NodePort
  port: 8080
  nodePort: 30080

ingress:
  enabled: false

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Pooled tenancy: set per Helm release. Not taken from the client.
tenant:
  id: ""

pathPrefix: ""

quota:
  enabled: false
  # 2 = migrate Job + 1 app replica. Scale to 3 → Pending.
  pods: "2"
  requestsCpu: "100m"
  requestsMemory: "256Mi"
  limitsCpu: "500m"
  limitsMemory: "512Mi"

networkPolicy:
  enabled: false
  # Kubelet + NodePort SNAT (externalTrafficPolicy Cluster) use the node IP.
  # Pod-to-pod uses the pod IP, so other tenants in the same subnet stay blocked.
  # kubectl get nodes -o wide
  ingressCidrs: []

# Database configuration
database:
  enabled: false
  secretName: ""
  host: ""
  name: "postgres"
  port: 5432
  migrate: false
  masterSecret: ""
  tenantSecrets: {}
  migratorServiceAccount:
    annotations: {}

# Environment
environment: dev
region: us-east-1