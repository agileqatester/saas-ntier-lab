replicaCount: 1

image:
  repository: python
  tag: "3.11-slim"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: test-app

service:
  # Phase A default: ClusterIP behind shared ALB Ingress (group.name).
  # Lab NodePort mode still supported via onboard --edge nodeport.
  type: ClusterIP
  port: 8080
  nodePort: null

ingress:
  enabled: false
  className: alb
  scheme: internet-facing
  targetType: ip
  groupName: ntier-dev
  # Lower order = higher precedence within the shared ALB group.
  groupOrder: "100"
  healthcheckPath: /health
  inboundCidrs: []
  accessLogsBucket: ""
  accessLogsPrefix: alb
  annotations: {}

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Pooled tenancy: set per Helm release. Not taken from the client.
tenant:
  id: ""

pathPrefix: ""

quota:
  enabled: false
  # 2 = migrate Job + 1 app replica. Scale to 3 → Pending.
  pods: "2"
  requestsCpu: "100m"
  requestsMemory: "256Mi"
  limitsCpu: "500m"
  limitsMemory: "512Mi"

networkPolicy:
  enabled: false
  # NodePort lab: node InternalIP/32 (kubelet + NodePort SNAT).
  # ALB controller (target-type ip): public subnet CIDRs only (ALB ENIs),
  # not the VPC CIDR — otherwise tenant pods could reach each other.
  ingressCidrs: []

# Database configuration
database:
  enabled: false
  secretName: ""
  host: ""
  name: "postgres"
  port: 5432
  migrate: false
  masterSecret: ""
  tenantSecrets: {}
  migratorServiceAccount:
    annotations: {}

# Environment
environment: dev
region: us-east-1