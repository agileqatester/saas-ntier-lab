# Example overlay for tenant a. Do not set service.nodePort — onboard_tenant.py
# uses tofu output tenant_node_ports (30080 + index in var.tenant_ids).
# First tenant_ids entry runs the RLS migrate Job.
fullnameOverride: test-app
serviceAccount:
  name: test-app
tenant:
  id: a
pathPrefix: /tenant-a
service:
  type: NodePort
  port: 8080
quota:
  enabled: true
networkPolicy:
  enabled: true
  ingressCidrs: []
database:
  migrate: true
