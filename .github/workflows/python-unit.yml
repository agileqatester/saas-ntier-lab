name: python-unit

on:
  push:
    paths:
      - "control-plane/**"
      - "helm/test-app/**"
      - "helm/platform-guardrails/**"
      - "tests/**"
      - ".github/workflows/python-unit.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - "helm/test-app/**"
      - "helm/platform-guardrails/**"
      - "tests/**"
      - ".github/workflows/python-unit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt -r control-plane/requirements.txt
      - name: Unit + CP contract (no cluster)
        working-directory: tests
        run: pytest -m unit -v --tb=short
