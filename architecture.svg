<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" role="img" aria-labelledby="title desc">
  <title id="title">saas-ntier-lab - private by default</title>
  <desc id="desc">Customer HTTPS to ALB to EKS NodePort. Operator kubectl and SSM to EKS in AZ 1a only. NAT egress only.</desc>
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="24" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#232f3e">saas-ntier-lab - private by default</text>

  <!-- Operator (above AZ 1a) -->
  <g id="operator">
    <rect x="250" y="44" width="150" height="44" rx="6" fill="#f2f3f3" stroke="#545b64" stroke-width="1.5"/>
    <text x="325" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#232f3e">You (operator)</text>
    <text x="325" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#545b64">kubectl + SSM to node</text>
  </g>

  <!-- Customer -->
  <g id="customer">
    <rect x="24" y="200" width="100" height="44" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <text x="74" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#232f3e">Customer</text>
    <text x="74" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#9a3412">HTTPS :443</text>
  </g>

  <!-- VPC closed box -->
  <rect x="150" y="100" width="560" height="500" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="164" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">VPC 10.0.0.0/16</text>

  <!-- IGW on left border; VPC line continues above and below -->
  <rect x="128" y="248" width="52" height="36" rx="4" fill="#7c3aed" stroke="#5b21b6" stroke-width="1"/>
  <text x="154" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">IGW</text>

  <!-- AZ 1a -->
  <rect x="168" y="132" width="250" height="448" rx="6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="180" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">us-east-1a (compute)</text>
  <rect x="180" y="160" width="226" height="150" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="192" y="176" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#047857">Public 10.0.1.0/24 - edge only</text>
  <rect x="196" y="190" width="194" height="44" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="293" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">ALB :443 (Dev :80 /32)</text>
  <text x="293" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#1e40af">HTTPS product / HTTP lab</text>
  <rect x="196" y="248" width="194" height="44" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="293" y="266" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9a3412">NAT t4g.nano + EIP</text>
  <text x="293" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#c2410c">egress only - not a bastion</text>

  <rect x="180" y="328" width="226" height="232" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="192" y="344" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#1d4ed8">Private 10.0.11.0/24 - no IGW, no public IP</text>
  <rect x="196" y="360" width="194" height="56" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="293" y="382" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9a3412">EKS 1.35 / t4g.small</text>
  <text x="293" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#c2410c">Helm app / NodePort 30080</text>
  <text x="192" y="440" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#64748b">NodePort = ALB instance target (no LB controller)</text>

  <!-- AZ 1b empty -->
  <rect x="432" y="132" width="258" height="448" rx="6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="444" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">us-east-1b (empty - 2 AZ for ALB/RDS)</text>
  <rect x="444" y="160" width="234" height="150" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="561" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#047857">Public 10.0.2.0/24</text>
  <text x="561" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">ALB ENI only - free</text>
  <rect x="444" y="328" width="234" height="232" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="561" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1d4ed8">Private 10.0.12.0/24</text>
  <text x="561" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">empty until RDS</text>

  <!-- Managed APIs -->
  <text x="740" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">AWS APIs</text>
  <rect x="740" y="132" width="330" height="48" rx="4" fill="#f8fafc" stroke="#64748b"/>
  <text x="756" y="152" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">S3 - gateway VPCE</text>
  <text x="756" y="166" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#475569">route in private RT (not an ENI)</text>
  <rect x="740" y="192" width="330" height="36" rx="4" fill="#f8fafc" stroke="#64748b"/>
  <text x="756" y="214" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">CloudWatch</text>
  <rect x="740" y="238" width="330" height="36" rx="4" fill="#f8fafc" stroke="#64748b"/>
  <text x="756" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">SNS</text>
  <rect x="740" y="284" width="330" height="36" rx="4" fill="#f8fafc" stroke="#64748b"/>
  <text x="756" y="306" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a">Secrets Manager</text>
  <rect x="740" y="330" width="330" height="48" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="5 3"/>
  <text x="756" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">RDS Postgres (enable_rds)</text>
  <text x="756" y="364" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#1d4ed8">ENIs in private subnets + SG</text>
  <rect x="740" y="392" width="330" height="40" rx="4" fill="#faf5ff" stroke="#7c3aed" stroke-dasharray="5 3"/>
  <text x="756" y="416" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b21b6">Later: PrivateLink provider - no IGW</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Customer  IGW  ALB (stays left / AZ 1a) -->
  <line x1="124" y1="222" x2="128" y2="258" stroke="#c2410c" stroke-width="2" marker-end="url(#arr-orange)"/>
  <line x1="180" y1="266" x2="196" y2="212" stroke="#c2410c" stroke-width="2" marker-end="url(#arr-orange)"/>
  <text x="88" y="196" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#9a3412">product</text>

  <!-- ALB  EKS -->
  <line x1="293" y1="234" x2="293" y2="360" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <text x="300" y="318" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#1e40af">VPC local :30080</text>

  <!-- EKS  NAT egress (AZ 1a only) -->
  <path d="M 220 388 C 168 388 168 270 196 270" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arr-orange)"/>
  <text x="152" y="340" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#c2410c">egress</text>

  <!-- kubectl + SSM: from operator, DOWN through AZ 1a only, never 1b -->
  <path d="M 280 88 L 240 88 L 240 380 L 196 380" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="198" y="98" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#475569">kubectl</text>
  <path d="M 340 88 L 360 88 L 360 396 L 390 396" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="344" y="98" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#475569">SSM to node</text>

  <!-- VPC  managed: from private 1a right edge -->
  <line x1="406" y1="388" x2="740" y2="156" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="406" y1="400" x2="740" y2="210" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="406" y1="412" x2="740" y2="256" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="406" y1="424" x2="740" y2="302" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="406" y1="436" x2="740" y2="354" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>

  <text x="24" y="640" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#232f3e">Legend</text>
  <line x1="24" y1="656" x2="70" y2="656" stroke="#1d4ed8" stroke-width="2"/>
  <text x="78" y="660" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#334155">data plane (ALB to NodePort)</text>
  <line x1="250" y1="656" x2="296" y2="656" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="304" y="660" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#334155">mgmt (kubectl / SSM) - AZ 1a only</text>
  <line x1="530" y1="656" x2="576" y2="656" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="3 3"/>
  <text x="584" y="660" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#334155">NAT egress (not customer)</text>
  <text x="24" y="690" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#64748b">Dev HTTP :80 /32 until ACM. NodePort 30080 = Terraform ALB instance targets (no AWS LB Controller on t4g.small).</text>
</svg>
